name: Build Volcengine + Anthropic images

on:
  push:
    tags:
      - "volc-anthropic-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Combined image version, for example 1.0.0-dev"
        required: true
        default: "dev"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check httpx==0.28.1 loguru==0.7.3 Jinja2==3.1.6

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  release:
    name: Build and publish combined images
    needs: python-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#volc-anthropic-v}"
          else
            version="${MANUAL_VERSION}"
          fi

          if [[ ! "${version}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid image version: ${version}" >&2
            exit 1
          fi

          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Run release checks
        shell: bash
        run: |
          bash -n deploy/install.sh
          MYSQL_ROOT_PASSWORD=release-check \
            docker compose -f deploy/centos-stream-9/docker-compose.yml config --quiet
          MYSQL_ROOT_PASSWORD=release-check \
            docker compose -f deploy/ubuntu/docker-compose.yml config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish xiaozhi-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:server_volc-anthropic-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=volc-anthropic-server
          cache-to: type=gha,mode=max,scope=volc-anthropic-server

      - name: Build and publish manager-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:web_volc-anthropic-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=volc-anthropic-web
          cache-to: type=gha,mode=max,scope=volc-anthropic-web

      - name: Print published image names
        run: |
          echo "${REGISTRY}/${IMAGE_NAME}:server_volc-anthropic-${VERSION}"
          echo "${REGISTRY}/${IMAGE_NAME}:web_volc-anthropic-${VERSION}"
